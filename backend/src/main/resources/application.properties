spring.datasource.url=jdbc:postgresql://localhost:5432/stock_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Sesion de usuario
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h

# Administrador inicial: solo se crea si la tabla Usuario esta vacia.
# En produccion conviene definirlos por variables de entorno y cambiar la contraseña.
app.admin-inicial.email=${APP_ADMIN_EMAIL:admin@taller.local}
app.admin-inicial.password=${APP_ADMIN_PASSWORD:Admin1234}